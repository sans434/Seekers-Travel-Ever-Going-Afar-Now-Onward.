        function loadBase64Image(img) {
            img.onerror = null;
            img.src = ORIGINAL_IMAGE_DATA;

        // ページロード時にも確実にチェックしてBase64に切り替え

            const img = document.getElementById('target-image');

                loadBase64Image(img);
